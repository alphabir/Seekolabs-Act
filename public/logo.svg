<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <!-- Icon Mark (Yellow Square) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="16" fill="#FFE600"/>
    <!-- Top-Left Cross 'X' -->
    <path d="M 24 24 L 40 40 M 40 24 L 24 40" stroke="#0B0C0E" stroke-width="7" stroke-linecap="round"/>
    <!-- Top-Right Square '■' -->
    <rect x="58" y="24" width="18" height="18" rx="2" fill="#0B0C0E"/>
    <!-- Bottom Underscore 'Mouth' -->
    <rect x="32" y="66" width="36" height="7" rx="3.5" fill="#0B0C0E"/>
  </g>
  
  <!-- Typography "seekolabs" -->
  <text x="135" y="82" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" letter-spacing="-3" fill="#FFFFFF">seekolabs</text>
</svg>
